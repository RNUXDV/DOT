<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DOT — Foundation</title>
    <meta
      name="description"
      content="DOT foundation build: orbit selector + transitions + theme persistence."
    />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="topbar">
      <div class="container">
        <div class="brand">DOT</div>
        <nav class="nav">
          <a href="#world">World</a>
          <a href="#themes">Themes</a>
          <a href="./prototypes/index.html">Prototypes</a>
        </nav>
      </div>
    </header>

    <main id="main" class="container">
      <section id="world" class="panel">
        <h1>DOT Foundation</h1>
        <p class="sub">
          Orbit selector + Cut transitions + theme cards + persistence.
        </p>

        <div class="world">
          <button class="dot center" aria-label="Your dot"></button>

          <div class="orbit" aria-label="Orbit selector">
            <button
              class="dot orbit-dot"
              data-orbit="people"
              data-title="People"
              data-desc="Connect with the people who make the orbit feel alive."
              data-link="#themes"
              aria-label="People"
            ></button>
            <button
              class="dot orbit-dot"
              data-orbit="music"
              data-title="Music"
              data-desc="Tune the space with focused listening and momentum."
              data-link="#themes"
              aria-label="Music"
            ></button>
            <button
              class="dot orbit-dot"
              data-orbit="play"
              data-title="Play"
              data-desc="Experiment with ideas and keep exploration lightweight."
              data-link="#themes"
              aria-label="Play"
            ></button>
            <button
              class="dot orbit-dot"
              data-orbit="ai"
              data-title="AI"
              data-desc="Partner with adaptive tools to extend your reach."
              data-link="#themes"
              aria-label="AI"
            ></button>
          </div>

          <div class="focused-panel" role="dialog" aria-hidden="true">
            <div class="focused-panel__content">
              <h3 class="focused-panel__title">Title</h3>
              <p class="focused-panel__desc">Description</p>
              <div class="focused-panel__actions">
                <a class="focused-panel__action" href="#themes">Primary action</a>
                <button class="focused-panel__back" type="button">Back</button>
              </div>
            </div>
          </div>
        </div>

        <div class="status" aria-live="polite" id="status">Status: ready</div>
      </section>

      <section id="themes" class="panel">
        <h2>B2 Theme Cards</h2>
        <div class="cards" id="themeCards"></div>
      </section>
    </main>

    <footer class="footer container">
      <small>DOT Foundation Build Room</small>
    </footer>

    <script type="module" src="./scripts/app.js"></script>
  </body>
</html>
